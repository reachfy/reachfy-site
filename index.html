<style>:root{--bg:#F3F4F8;--card:#fff;--ink:#14132B;--muted:#5A5A72;--soft:#4A4A60;--line:#E3E4EC;--field:#C9CAD6;--accent:#4F35E0;--accent-d:#3A24B8;--tint:#ECE9FD;--seg:#E6E7EF;--ok:#0A6B41;--ok-bg:#E3F5EC;--danger:#A1262C}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',Tahoma,system-ui,sans-serif;font-size:15px;line-height:1.6}
h1,h2,h3,p{margin:0}h1{font-size:26px;font-weight:700;line-height:1.4}h2{font-size:17px;font-weight:600}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}
a{color:var(--accent-d)}:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted);font-size:13px}.ltr{direction:ltr;unicode-bidi:isolate}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}
.stack{display:flex;flex-direction:column;gap:16px}.row{display:flex;align-items:center;gap:12px}.grow{flex:1;min-width:0}.between{justify-content:space-between}.wrap{flex-wrap:wrap}
.btn{min-height:48px;padding:0 20px;border:0;border-radius:14px;background:var(--accent);color:#fff;font-weight:700;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.btn.block{display:flex;width:100%}.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--field);font-weight:600}.btn.sm{min-height:44px;padding:0 14px;border-radius:12px;font-size:14px}
.btn.danger{background:#fff;color:var(--danger);border:1px solid var(--line);font-weight:600}
.pill{font-size:13px;font-weight:600;border-radius:12px;padding:4px 10px;background:var(--ok-bg);color:var(--ok);white-space:nowrap}.pill.tint{background:var(--tint);color:var(--accent-d)}
.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:13px;color:var(--soft)}
.input{height:48px;border:1px solid var(--field);border-radius:12px;padding:0 12px;background:#fff;width:100%}textarea.input{height:auto;padding:12px;resize:none;line-height:1.7}
.err{color:var(--danger);font-size:13px}
.seg{background:var(--seg);border-radius:14px;padding:4px;display:grid;gap:4px}.seg button{min-height:44px;border:0;border-radius:10px;background:none;color:var(--soft);font-weight:500;padding:0 12px}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);font-weight:600}
.switch{width:56px;height:44px;padding:0;border:0;background:none;display:flex;align-items:center;flex-shrink:0}
.switch span{width:52px;height:30px;border-radius:15px;padding:3px;display:flex;background:#8A8BA0;justify-content:flex-start}.switch[aria-checked=true] span{background:var(--accent);justify-content:flex-end}
.switch i{width:24px;height:24px;border-radius:12px;background:#fff}
.step{width:44px;height:44px;border-radius:12px;border:1px solid var(--field);background:#fff;font-size:22px;line-height:1}.step.plus{background:var(--accent);color:#fff;border:0}.step:disabled{opacity:.45;cursor:default}
.chip{display:inline-flex;align-items:center;gap:2px;background:var(--tint);color:var(--accent-d);border-radius:14px;padding:0 4px 0 12px;font-size:14px;font-weight:500}
[dir=rtl] .chip{padding:0 12px 0 4px}.chip button{width:32px;height:32px;border:0;background:none;color:inherit;font-size:16px}
.logo{width:40px;height:40px;display:block;flex:none}
.avatar{width:48px;height:48px;border-radius:24px;background:var(--tint);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;flex-shrink:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr));gap:12px}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:4px}
.stat b{font-size:26px;line-height:1.3}.stat.hl b{color:var(--accent)}
.shell{min-height:100vh;display:flex}.side{width:232px;flex-shrink:0;background:#fff;border-inline-end:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:6px}
.side a,.tabs a{text-decoration:none;color:var(--ink)}.side a{min-height:44px;display:flex;align-items:center;gap:10px;padding:0 12px;border-radius:12px;font-weight:500}
.side a[aria-current=page]{background:var(--tint);color:var(--accent-d);font-weight:700}
.main{flex:1;min-width:0;padding:28px clamp(16px,4vw,40px) 40px}.inner{max-width:880px;margin:0 auto}
.tabs{display:none}
@media (max-width:860px){.side{display:none}.main{padding-bottom:96px}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));position:fixed;inset-inline:0;bottom:0;height:72px;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:500;color:var(--muted)}.tabs a[aria-current=page]{color:var(--accent);font-weight:700}}
.narrow{max-width:460px;margin:0 auto;padding:20px 20px 40px;min-height:100vh;display:flex;flex-direction:column;gap:20px}
.iconbtn{width:44px;height:44px;border-radius:22px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink);flex-shrink:0}
[dir=rtl] .flip{transform:scaleX(-1)}
.list a,.list .li{display:flex;align-items:center;gap:12px;min-height:60px;text-decoration:none;color:var(--ink);border-top:1px solid var(--line)}.list>:first-child{border-top:0}
.thumb{width:60px;height:100px;border-radius:10px;background:var(--seg);color:var(--soft);display:flex;align-items:center;justify-content:center;font-size:11px;text-align:center;line-height:1.5;flex-shrink:0;padding:4px}
.reelstats{border-top:1px solid var(--line);margin:12px -16px -16px;padding:0 16px;min-height:44px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;font-size:13px}.reelstats b{font-weight:700}
.bars{height:170px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end}.bars div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px}
.bars i{width:100%;border-radius:6px 6px 2px 2px;background:#B9AEF5}.bars .max i{background:var(--accent)}
.meter{height:8px;border-radius:4px;background:var(--seg)}.meter i{display:block;height:8px;border-radius:4px;background:var(--accent)}
.hero{background:var(--accent);color:#fff;border-radius:22px;padding:22px 20px}
.note{background:var(--tint);color:#2A1A8C;border-radius:16px;padding:14px 16px;font-size:14px}
.land header{background:#fff;border-bottom:1px solid var(--line)}.land .w{max-width:1120px;margin:0 auto;padding-inline:24px}
.land nav a{min-height:44px;display:inline-flex;align-items:center;padding:0 12px;text-decoration:none;color:var(--ink);font-weight:500}
.land h1{font-size:clamp(32px,5.2vw,58px);line-height:1.3;max-width:760px;text-wrap:balance}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:18px}
.price{font-size:40px;font-weight:700;line-height:1.2}

quires."]],["Storage and retention",["The access token for your account is stored encrypted.","Prepared video variants are deleted from our storage after publishing.","When you delete your account we delete your data within 30 days, except what the law requires us to keep, such as invoice records."]],["Your rights",["At any time you can disconnect Instagram, pause publishing, ask for a copy of your data, or delete it. See \u201CData deletion\u201D."]],["Age",["The service is for people aged 18 or over."]],["Changes",["If we make a material change to this policy we will email you before it takes effect."]]]}},terms:{ar:{title:"\u0634\u0631\u0648\u0637 \u0627\u0644\u0627\u0633\u062A\u062E\u062F\u0627\u0645",intro:"\u0628\u0627\u0633\u062A\u062E\u062F\u0627\u0645\u0643 Reachfy \u0641\u0623\u0646\u062A \u062A\u0648\u0627\u0641\u0642 \u0639\u0644\u0649 \u0647\u0630\u0647 \u0627\u0644\u0634\u0631\u0648\u0637.",sections:[["\u0627\u0644\u062E\u062F\u0645\u0629",["Reachfy \u064A\u062C\u0647\u0651\u0632 \u0646\u0633\u062E\u0627\u064B \u0645\u0646 \u0641\u064A\u062F\u064A\u0648\u0647\u0627\u062A\u0643 \u0648\u064A\u0646\u0634\u0631\u0647\u0627 \u0639\u0644\u0649 \u062D\u0633\u0627\u0628\u0643 \u0641\u064A \u0625\u0646\u0633\u062A\u063A\u0631\u0627\u0645 \u0643\u0631\u064A\u0644\u0632 \u062A\u062C\u0631\u064A\u0628\u064A\u0629\u060C \u0648\u064A\u0639\u0631\u0636 \u0644\u0643 \u0646\u062A\u0627\u0626\u062C\u0647\u0627.","Reachfy \u062E\u062F\u0645\u0629 \u0645\u0633\u062A\u0642\u0644\u0629 \u0648\u0644\u064A\u0633\u062A \u062A\u0627\u0628\u0639\u0629 \u0644\u0640 Meta \u0623\u0648 Instagram."]],["\u062D\u0633\u0627\u0628\u0643 \u0648\u0645\u062D\u062A\u0648\u0627\u0643",["\u062A\u0631\u0628\u0637 \u062D\u0633\u0627\u0628 \u0625\u0646\u0633\u062A\u063A\u0631\u0627\u0645 \u062A\u0645\u0644\u0643\u0647 \u0623\u0648 \u0645\u0641\u0648\u064E\u0651\u0636 \u0628\u0625\u062F\u0627\u0631\u062A\u0647\u060C \u0648\u062D\u0633\u0627\u0628\u0627\u064B \u0648\u0627\u062D\u062F\u0627\u064B \u
